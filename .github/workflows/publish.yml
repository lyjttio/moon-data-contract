name: Publish Mooncakes package

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "The moon.mod version to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit stable
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify package before publish
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Publishing is restricted to the main branch."
            exit 1
          fi
          MODULE_VERSION="$(awk -F'\"' '/^version/ { print $2; exit }' moon.mod)"
          if [ "$MODULE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Requested version $EXPECTED_VERSION does not match moon.mod ($MODULE_VERSION)."
            exit 1
          fi
          moon version --all
          moon update
          moon check --deny-warn --target all
          moon test --deny-warn --target all
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code

      - name: Publish to Mooncakes
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "MOONCAKES_TOKEN is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon publish
